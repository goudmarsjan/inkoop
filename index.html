<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Goudmarsjan - Inkoop</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f1e8;
    color: #171717;
}

header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
}

header p {
    margin: 5px 0 0;
    color: #d5b45a;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

h2 { margin-top: 0; }

.gold-price {
    display: flex;
    gap: 10px;
    align-items: center;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.gold-price input { max-width: 220px; }

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #c7a84b;
    color: #111;
}

.dark {
    background: #111;
    color: white;
}

.delete {
    background: #eee;
    color: #b00000;
}

.add {
    margin-top: 15px;
    width: 100%;
}

.total {
    background: #111;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.total strong {
    font-size: 28px;
    color: #e0bd55;
}

.customer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 10px;
}

.settings {
    background: #f7f7f7;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}

.rate-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.rate-grid label {
    font-size: 13px;
    font-weight: bold;
}

.rate-grid input {
    margin-top: 5px;
}

@media(max-width:700px) {
    .grid {
        grid-template-columns: 1fr 1fr;
    }

    .customer-grid {
        grid-template-columns: 1fr;
    }

    .rate-grid {
        grid-template-columns: 1fr 1fr;
    }

    .actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>DE GOUDMARSJAN</h1>
    <p>EDELMETALEN — INKOOP</p>
</header>

<div class="container">

    <div class="card">
        <h2>🟡 Goudprijs</h2>

        <div class="gold-price">
            <input
                id="goldPrice"
                type="number"
                step="0.01"
                value="105"
                oninput="calculate()"
            >
            <strong>€/g — 24K</strong>
        </div>

        <details style="margin-top:15px;">
            <summary><b>⚙️ Mijn inkooppercentages</b></summary>

            <div class="settings">
                <div class="rate-grid">

                    <label>
                        9K %
                        <input id="rate9" type="number" value="65" oninput="calculate()">
                    </label>

                    <label>
                        14K %
                        <input id="rate14" type="number" value="70" oninput="calculate()">
                    </label>

                    <label>
                        18K %
                        <input id="rate18" type="number" value="75" oninput="calculate()">
                    </label>

                    <label>
                        22K %
                        <input id="rate22" type="number" value="80" oninput="calculate()">
                    </label>

                    <label>
                        24K %
                        <input id="rate24" type="number" value="90" oninput="calculate()">
                    </label>

                </div>
            </div>
        </details>
    </div>

    <div class="card">

        <h2>👤 Klant</h2>

        <div class="customer-grid">
            <input id="customerName" placeholder="Naam klant">
            <input id="customerPhone" placeholder="Telefoonnummer">
        </div>

    </div>

    <div class="card">

        <h2>💰 Inkoop</h2>

        <div id="items"></div>

        <button class="primary add" onclick="addItem()">
            + STUK TOEVOEGEN
        </button>

        <div class="total">
            <span>TOTALE INKOOP</span>
            <strong id="total">€ 0,00</strong>
        </div>

    </div>

    <div class="card">

        <h2>🧾 Aankoop</h2>

        <div class="actions">
            <button class="dark" onclick="savePurchase()">
                💾 INKOOP OPSLAAN
            </button>

            <button class="primary" onclick="printReceipt()">
                🧾 BON MAKEN
            </button>
        </div>

    </div>

    <div class="card">

        <h2>📋 Vorige inkopen</h2>

        <div id="history" class="empty">
            Nog geen inkopen opgeslagen.
        </div>

    </div>

</div>

<script>

let items = [];
let purchases = JSON.parse(localStorage.getItem("goudmarsjan_purchases") || "[]");

const purity = {
    "9K": 0.375,
    "14K": 0.585,
    "18K": 0.750,
    "22K": 0.916,
    "24K": 1.000
};

function addItem() {
    items.push({
        karat: "18K",
        weight: 0
    });

    renderItems();
    calculate();
}

function removeItem(index) {
    items.splice(index, 1);
    renderItems();
    calculate();
}

function renderItems() {

    const container = document.getElementById("items");

    if (items.length === 0) {
        container.innerHTML = `
            <div class="empty">
                Nog geen stukken toegevoegd.
            </div>
        `;
        return;
    }

    container.innerHTML = items.map((item, index) => {

        return `
        <div class="grid" style="margin-bottom:12px;">

            <select onchange="changeKarat(${index}, this.value)">
                <option ${item.karat === "9K" ? "selected" : ""}>9K</option>
                <option ${item.karat === "14K" ? "selected" : ""}>14K</option>
                <option ${item.karat === "18K" ? "selected" : ""}>18K</option>
                <option ${item.karat === "22K" ? "selected" : ""}>22K</option>
                <option ${item.karat === "24K" ? "selected" : ""}>24K</option>
            </select>

            <input
                type="number"
                step="0.01"
                min="0"
                placeholder="Gewicht in gram"
                value="${item.weight || ""}"
                oninput="changeWeight(${index}, this.value)"
            >

            <input
                type="text"
                readonly
                value="${formatEuro(calculateItem(item))}"
            >

            <button class="delete" onclick="removeItem(${index})">
                ✕
            </button>

        </div>
        `;

    }).join("");
}

function changeKarat(index, value) {
    items[index].karat = value;
    renderItems();
    calculate();
}

function changeWeight(index, value) {
    items[index].weight = parseFloat(value) || 0;
    calculate();
}

function getRate(karat) {

    if (karat === "9K")
        return parseFloat(document.getElementById("rate9").value) || 0;

    if (karat === "14K")
        return parseFloat(document.getElementById("rate14").value) || 0;

    if (karat === "18K")
        return parseFloat(document.getElementById("rate18").value) || 0;

    if (karat === "22K")
        return parseFloat(document.getElementById("rate22").value) || 0;

    if (karat === "24K")
        return parseFloat(document.getElementById("rate24").value) || 0;

    return 0;
}

function calculateItem(item) {

    const goldPrice =
        parseFloat(document.getElementById("goldPrice").value) || 0;

    const pureGold =
        (item.weight || 0) * purity[item.karat];

    const marketValue =
        pureGold * goldPrice;

    const rate =
        getRate(item.karat) / 100;

    return marketValue * rate;
}

function calculate() {

    let total = 0;

    items.forEach(item => {
        total += calculateItem(item);
    });

    document.getElementById("total").innerText =
        formatEuro(total);

}

function formatEuro(value) {

    return new Intl.NumberFormat("nl-BE", {
        style: "currency",
        currency: "EUR"
    }).format(value || 0);

}

function savePurchase() {

    if (items.length === 0) {
        alert("Voeg eerst minstens één stuk toe.");
        return;
    }

    const total =
        items.reduce((sum, item) => sum + calculateItem(item), 0);

    const purchase = {

        id:
            "GM-" +
            new Date().getFullYear() +
            "-" +
            String(purchases.length + 1).padStart(4, "0"),

        date:
            new Date().toLocaleString("nl-BE"),

        customer:
            document.getElementById("customerName").value || "Onbekend",

        phone:
            document.getElementById("customerPhone").value || "",

        items:
            JSON.parse(JSON.stringify(items)),

        total:
            total
    };

    purchases.unshift(purchase);

    localStorage.setItem(
        "goudmarsjan_purchases",
        JSON.stringify(purchases)
    );

    renderHistory();

    alert("Inkoop opgeslagen!\n\n" + purchase.id);
}

function renderHistory() {

    const container =
        document.getElementById("history");

    if (purchases.length === 0) {
        container.innerHTML =
            "Nog geen inkopen opgeslagen.";
        return;
    }

    container.innerHTML =
        purchases.slice(0, 20).map(p => {

            return `
            <div style="
                border-bottom:1px solid #ddd;
                padding:12px 0;
            ">

                <strong>${p.id}</strong><br>

                ${p.customer}<br>

                <small>${p.date}</small>

                <div style="
                    font-weight:bold;
                    margin-top:5px;
                ">
                    ${formatEuro(p.total)}
                </div>

            </div>
            `;

        }).join("");
}

function printReceipt() {

    if (items.length === 0) {
        alert("Voeg eerst minstens één stuk toe.");
        return;
    }

    const customer =
        document.getElementById("customerName").value || "Onbekend";

    const phone =
        document.getElementById("customerPhone").value || "";

    const total =
        items.reduce((sum, item) => sum + calculateItem(item), 0);

    const rows =
        items.map(item => {

            return `
            <tr>
                <td>${item.karat}</td>
                <td>${(item.weight || 0).toFixed(2)} g</td>
                <td>${formatEuro(calculateItem(item))}</td>
            </tr>
            `;

        }).join("");

    const receipt = `
    <!DOCTYPE html>

    <html lang="nl">

    <head>

        <meta charset="UTF-8">

        <title>Goudmarsjan aankoopbon</title>

        <style>

            body {
                font-family: Arial;
                padding:40px;
                max-width:700px;
                margin:auto;
            }

            h1 {
                letter-spacing:2px;
            }

            table {
                width:100%;
                border-collapse:collapse;
                margin-top:30px;
            }

            th, td {
                border-bottom:1px solid #ddd;
                padding:12px;
                text-align:left;
            }

            .total {
                font-size:24px;
                font-weight:bold;
                margin-top:30px;
            }

        </style>

    </head>

    <body>

        <h1>DE GOUDMARSJAN</h1>

        <h3>EDELMETALEN — AANKOOPBON</h3>

        <p>
            <b>Klant:</b> ${customer}<br>
            <b>Telefoon:</b> ${phone}<br>
            <b>Datum:</b> ${new Date().toLocaleString("nl-BE")}
        </p>

        <table>

            <tr>
                <th>Karaat</th>
                <th>Gewicht</th>
                <th>Inkoopwaarde</th>
            </tr>

            ${rows}

        </table>

        <div class="total">
            TOTAAL: ${formatEuro(total)}
        </div>

        <br><br>

        <p>
            DE GOUDMARSJAN<br>
            EDELMETALEN
        </p>

    </body>

    </html>
    `;

    const win =
        window.open("", "_blank");

    win.document.write(receipt);
    win.document.close();

    win.print();
}

addItem();
renderHistory();
calculate();

</script>

</body>
</html>
